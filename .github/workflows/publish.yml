name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish package
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:smoke
      - name: Publish with npm trusted publishing
        run: npm publish --access public

  notify-site:
    name: Notify site after npm publish
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_REPO_PAT: ${{ secrets.SITE_REPO_PAT }}
    steps:
      - name: Skip site notification when no token is configured
        if: ${{ env.SITE_REPO_PAT == '' }}
        run: echo "SITE_REPO_PAT is not configured; skipping site notification."
      - name: Trigger site update
        if: ${{ env.SITE_REPO_PAT != '' }}
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ env.SITE_REPO_PAT }}
          repository: abhirup/gamr-site
          event-type: gamr-updated
          client-payload: '{"version": "${{ github.ref_name }}"}'
