version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x currently declares TypeScript support below 6.1.
      # Keep compatible updates flowing while preventing known-broken 7.x PRs.
      - dependency-name: typescript
        versions:
          - ">=7"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
