name: Notify site

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published version tag to send to the site
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-notify-${{ github.event.workflow_run.id || inputs.version }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify site after npm publish
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_REPO_PAT: ${{ secrets.SITE_REPO_PAT }}
      RELEASE_VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
    steps:
      - name: Skip site notification when no token is configured
        if: ${{ env.SITE_REPO_PAT == '' }}
        run: echo "SITE_REPO_PAT is not configured; skipping site notification."
      - name: Trigger site update
        if: ${{ env.SITE_REPO_PAT != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.SITE_REPO_PAT }}
          repository: abhirup/gamr-site
          event-type: gamr-updated
          client-payload: '{"version": "${{ env.RELEASE_VERSION }}"}'
